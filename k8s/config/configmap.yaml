apiVersion: v1
kind: ConfigMap
metadata:
  name: saqbol-config
  namespace: saqbol
data:
  GIN_MODE: "release"
  ML_MOCK: "false"
  ML_GRPC_ADDR: "ml:9090"
  REDIS_URL: "redis://redis:6379/0"
  ACCESS_TOKEN_TTL: "15m"
  REFRESH_TOKEN_TTL: "168h"
  SCAM_THRESHOLD: "0.8"
  SUSPICIOUS_THRESHOLD: "0.45"
  MODEL_VERSION: "baseline-tfidf-logreg-v1"
  RATE_LIMIT_PER_MIN: "60"
  ADMIN_PHONES: "+77000000001"
  POSTGRES_USER: "saqbol"
  POSTGRES_DB: "saqbol"
