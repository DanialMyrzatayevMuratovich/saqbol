
name: CI

on:
  push:
  pull_request:

jobs:
  backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: saqbol-backend
    # Real PostgreSQL and Redis for the API integration tests in internal/integration.
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: saqbol
          POSTGRES_PASSWORD: saqbol
          POSTGRES_DB: saqbol_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U saqbol -d saqbol_test"
          --health-interval 5s --health-timeout 5s --health-retries 10
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      TEST_DATABASE_URL: postgres://saqbol:saqbol@localhost:5432/saqbol_test?sslmode=disable
      TEST_REDIS_URL: redis://localhost:6379/0
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.25"
      - run: go build ./...
      - run: go vet ./...
      - run: go test ./...

  ml:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: saqbol-ml
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install -r requirements.txt -r requirements-dev.txt
      - run: bash scripts/gen_proto.sh
      - run: python -m pytest -q
      - run: python training/evaluate.py

  mobile:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: saqbol-mobile
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
      - run: flutter pub get
      - run: flutter analyze
      - run: flutter test

  web:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: saqbol-web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - run: npm ci
      - run: npm run lint
      - run: npm test
      - run: npm run build
